[package]
name = "it-elkhawga"
version = "1.2.6"
description = "IT ELKHAWGA - Company device and internet control"
authors = ["Ahmed Wahba"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
chrono = "0.4"
png = "0.18"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
